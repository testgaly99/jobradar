# Holt die Stellen und schreibt sie in Supabase.
# Läuft täglich um 04:00 UTC (5 bzw. 6 Uhr deutscher Zeit) und hält so auch Supabase wach.
# Per Knopf (Actions -> Täglicher Lauf -> Run workflow) jederzeit startbar.
name: Täglicher Lauf

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: taeglich
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    # Der erste Lauf mit dm und Porsche lädt mehrere tausend Seiten mit 1 Anfrage pro Sekunde.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # Browser für Bewerbungen aus Karriereseiten, die per JavaScript laden (Rückfall, falls der Sofort-Lauf nicht lief)
      - run: python -m playwright install --with-deps chromium
      # Exit 1 = alle Firmen fehlgeschlagen: Job schlägt fehl, GitHub schickt eine Mail.
      - run: python -m scraper.run
        id: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Ein früher fehlgeschlagener Test darf keine alten Laufberichte melden.
      # Ein begrenztes PAT kann Issues-Ereignisse auslösen; github.token allein nicht.
      - name: Gesundheit prüfen
        if: always() && !cancelled() && steps.scraper.outcome != 'skipped' && steps.scraper.outcome != ''
        run: python -m scraper.gesundheit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_ISSUE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Tägliche Zusammenfassungen
        if: always() && !cancelled() && steps.scraper.outcome != 'skipped' && steps.scraper.outcome != ''
        run: python -m scraper.digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEITE_URL: ${{ secrets.SEITE_URL }}
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Bestandsfirmen werden erst nach bestätigtem DB-Umzug aus dieser Datei entfernt.
          # Es werden nie private DB-Firmen in die CSV geschrieben.
          git add data/bericht.md data/companies.csv
          if ! git diff --cached --quiet; then
            git commit -m "Täglicher Lauf $(date -u +%F)"
            git pull --rebase
            git push
          fi
