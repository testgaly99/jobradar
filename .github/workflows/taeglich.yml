# Holt täglich die Stellen, schreibt in Supabase.
# 04:00 UTC sind 5 Uhr (Winter) bzw. 6 Uhr (Sommer) deutscher Zeit. Per Knopf jederzeit startbar.
name: Täglicher Lauf

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taeglich
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # Exit 1 = alle Firmen fehlgeschlagen: Job schlägt fehl, GitHub schickt eine Mail.
      - run: python -m scraper.run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bericht.md
          if ! git diff --cached --quiet; then
            git commit -m "Täglicher Lauf $(date -u +%F)"
            git pull --rebase
            git push
          fi
