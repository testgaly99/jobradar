# Lokale Vorbereitung; Aktivierung erst nach gesondert freigegebenem Upload.
# Keine Anbieter-Secrets, kein Scraperlauf, keine Migration/Veröffentlichung.
name: Codeprüfung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codepruefung-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bestehende Testabhängigkeiten bereitstellen
        run: python -m pip install -r requirements.txt
      - name: Geschützte Offline-Tests
        run: python -B -m pruefe_offline

  web:
    name: Website offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Bestehende gesperrte Abhängigkeiten bereitstellen
        run: npm ci
      - name: Webtests
        run: npm test
      - name: Typprüfung
        run: ./node_modules/.bin/tsc --noEmit --incremental false
      - name: Isolierter Produktions-Build mit Netzsperre
        run: npm run pruefe:build
